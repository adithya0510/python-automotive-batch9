<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Details</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #ffcccc,
        #cce6ff,
        #ffd6d6,
        #d9f0ff
    );
    background-size: 300% 300%;
    animation: gradientMove 16s ease infinite;
}

@keyframes gradientMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* === GLASS CARD === */
.card {
    width: 520px;
    padding: 40px;
    text-align: center;

    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(18px);
    border-radius: 22px;

    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    animation: float 5s ease-in-out infinite alternate;
}

@keyframes float {
    from { transform: translateY(0px); }
    to   { transform: translateY(-12px); }
}

.project-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #222;
}

.divider {
    height: 1px;
    background: rgba(0,0,0,0.2);
    margin: 20px 0;
}

.details {
    font-size: 18px;
    color: #333;
    background: rgba(255,255,255,0.5);
    padding: 14px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="card">

    <div class="project-title">
        🚗 AUTOSAR Sensor Validation and Signal Testing
    </div>

    <div class="divider"></div>

    <div class="details">
        Name: Pavan Adithya <br>
        Batch: 25SUB4527_AutomotiveTesting <br>
        User ID: 55937
    </div>

</div>

</body>
</html>
