<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pavan Adithya | QR Info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        /* BACKGROUND */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center,
                    rgba(128, 0, 32, 0.55),
                    #050000 70%);
            overflow: hidden;
            color: #fff;
        }

        /* MOVING LINES */
        .lines {
            position: absolute;
            width: 100%;
            height: 200%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 255, 140, 0.08),
                rgba(0, 255, 140, 0.08) 1px,
                transparent 1px,
                transparent 25px
            );
            animation: moveLines 12s linear infinite;
        }
        @keyframes moveLines {
            from { transform: translateY(0); }
            to   { transform: translateY(-50%); }
        }

        /* CONTENT CARD */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.55);
            padding: 30px 40px;
            border-radius: 14px;
            text-align: center;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 25px rgba(128, 0, 32, 0.5);
        }

        .card h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #ffb3c6;
        }

        .card p {
            font-size: 16px;
            margin: 6px 0;
            color: #e6e6e6;
        }

        .highlight {
            color: #7CFCB5;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="lines"></div>

    <!-- Content -->
    <div class="card">
        <h1>Pavan Adithya</h1>
        <p>Batch: <span class="highlight">Python Automotive – Batch 9</span></p>
        <p>ID: <span class="highlight">PA0510</span></p>
    </div>

</body>
</html>
