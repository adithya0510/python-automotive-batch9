<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Details</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: monospace;
            color: #ffeaea;
            overflow: hidden;
        }

        /* Animated brown → burgundy background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #4a1f1f 0%,
                    #3a1717 40%,
                    #2a1414 65%,
                    #1f1010 100%
                );

            animation: bgMove 12s ease-in-out infinite alternate;
        }

        @keyframes bgMove {
            0% {
                background-position: center;
            }
            100% {
                background-position: top left;
            }
        }

        /* Center card */
        .box {
            border: 1.5px solid rgba(255, 120, 120, 0.6);
            padding: 35px 60px;
            text-align: center;
            font-size: 22px;
            line-height: 1.8;

            background: rgba(60, 20, 20, 0.55);
            backdrop-filter: blur(6px);

            box-shadow:
                0 0 25px rgba(140, 30, 30, 0.7),
                inset 0 0 15px rgba(120, 20, 20, 0.5);

            animation: glow 4s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow:
                    0 0 18px rgba(120, 30, 30, 0.6),
                    inset 0 0 10px rgba(100, 20, 20, 0.4);
            }
            to {
                box-shadow:
                    0 0 35px rgba(180, 50, 50, 0.9),
                    inset 0 0 18px rgba(160, 40, 40, 0.7);
            }
        }
    </style>
</head>

<body>
    <div class="box">
        Name: Pavan Adithya<br>
        Batch: 25SUB4527_AutomotiveTesting<br>
        User ID: 55937
    </div>
</body>
</html>
